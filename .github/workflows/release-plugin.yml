name: Build And Release Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Ensure build script is executable
        run: chmod +x scripts/build-release.sh

      - name: Build plugin ZIP
        id: build
        shell: bash
        run: |
          BUILD_OUTPUT="$(scripts/build-release.sh)"
          echo "${BUILD_OUTPUT}"
          VERSION="$(echo "${BUILD_OUTPUT}" | awk -F'=' '/^version=/{print $2; exit}')"
          ZIP_PATH="$(echo "${BUILD_OUTPUT}" | awk -F'=' '/^zip_path=/{print $2; exit}')"

          if [ -z "${VERSION}" ] || [ -z "${ZIP_PATH}" ]; then
            echo "Failed to extract version or zip path from build output." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create or update release and upload ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.build.outputs.tag }}"
          VERSION="${{ steps.build.outputs.version }}"
          ZIP_PATH="${{ steps.build.outputs.zip_path }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Technomancer WP v${VERSION}" \
              --latest
          else
            gh release create "${TAG}" "${ZIP_PATH}" \
              --target "${GITHUB_SHA}" \
              --title "Technomancer WP v${VERSION}" \
              --generate-notes \
              --latest
          fi

          gh release upload "${TAG}" "${ZIP_PATH}" --clobber
